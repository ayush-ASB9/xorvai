services:
  web:
    # Local Worker with static assets and in-memory KV. CLOUDFLARE_INCLUDE_PROCESS_ENV passes Amp
    # secrets such as ANTHROPIC_API_KEY to the Worker, so no .dev.vars file is needed in orbs.
    command: npx wrangler dev --ip 0.0.0.0 --port "$PORT" --show-interactive-dev-session=false
    env:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      WRANGLER_SEND_METRICS: "false"
    health: /api/health
    portal:
      title: XORVAI
